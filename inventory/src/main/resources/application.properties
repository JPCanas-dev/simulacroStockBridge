spring.application.name=inventory
server.port=8080

# Base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockbridge_inventory}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Migraciones Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Seguridad y JWT (clave 256 bits)
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Microservicio externo de proveedores
application.services.supplier.base-url=${SUPPLIER_SERVICE_URL:http://localhost:8081}
application.services.supplier.timeout-ms=${SUPPLIER_SERVICE_TIMEOUT_MS:5000}

# Observabilidad y Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
