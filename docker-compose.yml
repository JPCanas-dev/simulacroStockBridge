version: '3.8'

services:
  # Base de datos relacional PostgreSQL
  postgres-db:
    image: postgres:16-alpine
    container_name: stockbridge-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-stockbridge_inventory}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-stockbridge_inventory}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stockbridge-network

  # Microservicio independiente de disponibilidad de proveedores
  supplier-service:
    build:
      context: ./supplier-service
      dockerfile: Dockerfile
    container_name: stockbridge-supplier-service
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
    networks:
      - stockbridge-network

  # Microservicio principal de gestion de inventario
  inventory-service:
    build:
      context: ./inventory
      dockerfile: Dockerfile
    container_name: stockbridge-inventory-service
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres-db:5432/${DB_NAME:-stockbridge_inventory}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SUPPLIER_SERVICE_URL: http://supplier-service:8081
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    depends_on:
      postgres-db:
        condition: service_healthy
      supplier-service:
        condition: service_started
    networks:
      - stockbridge-network

volumes:
  postgres_data:
    driver: local

networks:
  stockbridge-network:
    driver: bridge
